[project]
name = "docsearch"
version = "0.1.0"
description = "Search Python package docs from the terminal and read them in Safari, 100% offline."
readme = "README.md"
requires-python = ">=3.11"   # tomllib (packages.toml) is in the standard library from 3.11
dependencies = [
    "rapidfuzz>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "markdown-it-py>=3.0",
    "httpx>=0.27",
    "pygments>=2.14",
    "numpy>=1.24",
    "mlx>=0.32",                  # the meaning model runs on the Apple GPU (no PyTorch)
    "tokenizers>=0.20",
    "huggingface-hub>=0.30",      # downloads the model once (search add / embed)
]

[project.scripts]
search = "docsearch.cli:main"   # search numpy svd  (opens Safari)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docsearch"]

[dependency-groups]
eval = [                          # only for the search-quality benchmark (eval/)
    "mlx-lm>=0.32.0",
    "sentence-transformers>=2.7",
]
