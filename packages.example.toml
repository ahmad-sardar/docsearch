# Your docs list. `search setup` copies this file to packages.toml (your own, not in git)
# and starts with nothing: add what you want, with `search add NAME` (it lands here), or
# list it below and run: search sync
#
#   numpy = "latest"                           the current docs (PyPI finds the site)
#   numpy = "1.26"                             the docs of one version
#   numpy = ["latest", "1.26"]                 several versions, side by side
#   rust = "latest"                            a language or toolkit (see: search known)
#   mydocs = { url = "https://docs.example.com/" }   any docs site
#   pg = [{ url = "https://www.postgresql.org/docs/16/", version = "16" },
#         { url = "https://www.postgresql.org/docs/17/", version = "17" }]   an address of each version
#   mydocs = { path = "~/Downloads/docs.zip" }       docs you downloaded yourself
#   pandas = { version = "2.1", embed = false }      no meaning search (faster to add)
#
# `search add`, `remove`, `update` and `downgrade` keep this file up to date.

[packages]

[man]
pages = []          # man pages (mac and linux), for example: ["git", "bash", "tmux"]
