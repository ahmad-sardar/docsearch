# On fresh Windows, Linux and Mac machines, with Hugging Face blocked (as some networks
# do): run the README's install block as a person would paste it, then index a small
# folder of docs and search it end to end (tests/smoke.py). The models come from this
# project's GitHub release; they run on the processor (numpy) on Windows and Linux, and on
# the GPU (MLX) on the Apple-silicon Mac. Every supported Python on Windows and Linux.
name: smoke
on:
  push:
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: block Hugging Face (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content C:\Windows\System32\drivers\etc\hosts "`n0.0.0.0 huggingface.co"
      - name: block Hugging Face (linux, mac)
        if: runner.os != 'Windows'
        run: |
          echo "0.0.0.0 huggingface.co" | sudo tee -a /etc/hosts
          if [ "$RUNNER_OS" = macOS ]; then sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true; fi
      - name: Hugging Face is unreachable
        shell: bash
        run: if curl -sS -m 15 -o /dev/null https://huggingface.co; then echo "still reachable"; exit 1; fi
      # The README's install block, run as pasted, except that it clones the branch under
      # test. Then `search` must be docsearch's, not another program of that name.
      - name: README install block (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $block = ((Get-Content README.md -Raw) -split '```powershell')[1]
          $block = ($block -split '```')[0] -replace 'git clone ', "git clone -b $env:GITHUB_REF_NAME "
          Invoke-Expression $block
          $found = (Get-Command search).Source
          if ($found -ne "$HOME\docsearch\bin\search.exe") { throw "search runs $found" }
          search known
          $user = [Environment]::GetEnvironmentVariable("Path", "User")
          if (-not $user.StartsWith("$HOME\docsearch\bin")) { throw "bin is not first on the user PATH: $user" }
          Set-Location $env:TEMP
          & "$HOME\docsearch\bin\search.exe" list
      - name: README install block (linux, mac)
        if: runner.os != 'Windows'
        run: |
          awk '/^### mac, linux/{f=1} f&&/^```bash/{g=1;next} g&&/^```/{exit} g' README.md \
            | sed -e "s|git clone |git clone -b $GITHUB_REF_NAME |" \
            > "$RUNNER_TEMP/install.sh"
          cat "$RUNNER_TEMP/install.sh"
          echo "SHELL=$SHELL"
          bash -e "$RUNNER_TEMP/install.sh"
          "$(basename "$SHELL")" -ic 'type search; search known' | tee "$RUNNER_TEMP/out.txt"
          grep -Eq "search is (aliased to|an alias for) .*docsearch/.venv/bin/search" "$RUNNER_TEMP/out.txt"
      - name: index, search, remove
        run: |
          uv sync
          uv run python -c "import sys; print(sys.version)"
          uv run python tests/smoke.py
          uv run python tests/crawl.py
