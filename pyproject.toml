[project]
name = "docsearch"
version = "0.1.0"
description = "Search official documentation from the terminal and read it in your browser, 100% offline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"   # tomllib (packages.toml) is in the standard library from 3.11
dependencies = [
    "rapidfuzz>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
    "markdown-it-py>=3.0",
    "httpx>=0.27",
    "pygments>=2.14",
    "numpy>=1.24",
    # the models run on the Apple GPU (no PyTorch); elsewhere on the processor with numpy
    "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tokenizers>=0.20",
    "huggingface-hub>=0.30",      # downloads the model once (search add / embed)
    "jellyfish>=1.2",
]

[project.scripts]
search = "docsearch.cli:main"   # search numpy svd  (opens the browser)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docsearch"]

[dependency-groups]
eval = [                          # only for the search-quality benchmark (eval/)
    "mlx-lm>=0.32.0",
    "sentence-transformers>=2.7",
]
