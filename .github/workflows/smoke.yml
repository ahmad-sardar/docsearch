# On a fresh Windows and Linux machine, with Hugging Face blocked (as some networks do):
# install as the README says, then index a small folder of docs and search it end to end
# (tests/smoke.py). The models come from this project's GitHub release and run on the
# processor (numpy), as they would for anyone without an Apple-silicon Mac. Every
# supported Python.
name: smoke
on:
  push:
    branches: [windows]
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: block Hugging Face (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content C:\Windows\System32\drivers\etc\hosts "`n0.0.0.0 huggingface.co"
      - name: block Hugging Face (linux)
        if: runner.os != 'Windows'
        run: echo "0.0.0.0 huggingface.co" | sudo tee -a /etc/hosts
      - name: Hugging Face is unreachable
        shell: bash
        run: if curl -sS -m 15 -o /dev/null https://huggingface.co; then echo "still reachable"; exit 1; fi
      # The README's install block, copied as a person would (it clones this branch from
      # GitHub); only `search setup`, which downloads every docs site, becomes `search known`.
      - name: README install block (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $block = ((Get-Content README.md -Raw) -split '```powershell')[1]
          $block = ($block -split '```')[0] -replace 'search setup', 'search known'
          Invoke-Expression $block
          search known
          $user = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($user -notlike "*docsearch\.venv\Scripts*") { throw "search is not on the user PATH" }
      - name: README install block (linux)
        if: runner.os != 'Windows'
        run: |
          awk '/^### linux/{f=1} f&&/^```bash/{g=1;next} g&&/^```/{exit} g' README.md \
            | sed 's/search setup/search known/' > "$RUNNER_TEMP/install.sh"
          cat "$RUNNER_TEMP/install.sh"
          bash -e "$RUNNER_TEMP/install.sh"
          bash -ic 'search known'
      - name: index, search, remove
        run: |
          uv sync
          uv run python -c "import sys; print(sys.version)"
          uv run python tests/smoke.py
